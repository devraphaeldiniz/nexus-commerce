<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#floor)"/>
  <!-- Linhas do piso simulando ambiente moderno -->
  <line x1="0" y1="120" x2="500" y2="120" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="0" y1="380" x2="500" y2="380" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Corpo Principal do Robô -->
  <g filter="url(#shadow)">
    <!-- Bumper externo antichoque -->
    <circle cx="250" cy="250" r="165" fill="#334155"/>
    <!-- Corpo circular elegante -->
    <circle cx="250" cy="250" r="158" fill="url(#bodyGrad)"/>
    <!-- Tampa / Anel de acabamento -->
    <circle cx="250" cy="250" r="125" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <!-- Sensor Torre Laser LiDAR (Central) -->
    <circle cx="250" cy="225" r="45" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <circle cx="250" cy="225" r="36" fill="#0f172a"/>
    <!-- Abertura do Laser Lidar 360 -->
    <rect x="235" y="222" width="30" height="7" rx="3" fill="#38bdf8"/>
    <!-- Painel de botões Touch Power / Home -->
    <circle cx="250" cy="315" r="14" fill="#38bdf8" opacity="0.9"/>
    <circle cx="250" cy="315" r="10" fill="#0284c7"/>
    <circle cx="215" cy="315" r="9" fill="#94a3b8"/>
    <circle cx="285" cy="315" r="9" fill="#94a3b8"/>
    <!-- Logo Nexus Clean -->
    <text x="250" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#64748b" letter-spacing="3">NEXUS ROBOTICS</text>
  </g>
</svg>
